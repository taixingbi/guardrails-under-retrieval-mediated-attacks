# Independence check: A2 poison passages regenerated by deepseek (main used gpt-oss, the
# guard model; 27/100 fell back to a fixed template under its 220-token limit).
# Same frozen seeds and hybrid v3 defense; A2 only, no clean runs. Run with `run-transfer`.
extends: main.yaml
run_id: main_a2ds
output_dir: data/runs/main_a2ds
reuse_from: data/runs/main
attack_family: in_distribution
attack_generator_model: deepseek
attacks: [context_poisoning]
skip_clean_runs: true
guardrails: [G0, G1, G2]
http_retries: 8
chat:
  guardrail_max_tokens: 4096
  attack_max_tokens: 1024
