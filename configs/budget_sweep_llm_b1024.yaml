# E6 budget sweep: LLM-only G1 at a 1024-token guard budget, first 50 seeds, both target models.
# Only guardrail_max_tokens differs across budget_sweep_llm_b*; 768 and 4096 points come from
# main_ablation_llm and main_ablation_llm_b4096 restricted to the same seeds (gurma budget-sweep).
extends: main_ablation_llm.yaml
run_id: budget_sweep_llm_b1024
output_dir: data/runs/budget_sweep_llm_b1024
seed_limit: 50
http_retries: 8
guardrails: [G1]
guardrail_reasoning: direct
chat:
  guardrail_max_tokens: 1024
