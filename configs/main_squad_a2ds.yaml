# E5 SQuAD, A2 regenerated by deepseek on the frozen SQuAD seeds (independence check).
# Run with `run-transfer`.
extends: main_squad.yaml
run_id: main_squad_a2ds
output_dir: data/runs/main_squad_a2ds
reuse_from: data/runs/main_squad
attack_family: in_distribution
attack_generator_model: deepseek
attacks: [context_poisoning]
skip_clean_runs: true
guardrails: [G0, G1, G2]
http_retries: 8
chat:
  guardrail_max_tokens: 4096
  attack_max_tokens: 1024
